<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>진단</title>
<style>body{font-family:sans-serif;padding:20px} button{padding:12px;width:100%;margin:6px 0} #log{background:#111;color:#0f0;padding:10px;white-space:pre-wrap}</style>
</head><body><h2>🔊 진단</h2>
<button id="b1">1. 비프음</button><button id="b2">2. 네이티브 TTS</button>
<audio id="a" controls style="width:100%"></audio><div id="log"></div>
<script>
const logEl=document.getElementById('log'); function log(m){ logEl.textContent+=m+'\n'; }
document.getElementById('b1').onclick=async()=>{ const ctx=new (window.AudioContext||window.webkitAudioContext)(); await ctx.resume(); const o=ctx.createOscillator(); o.connect(ctx.destination); o.start(); setTimeout(()=>o.stop(),500); log('비프음'); };
document.getElementById('b2').onclick=()=>{ const u=new SpeechSynthesisUtterance('안녕하세요 테스트입니다'); u.lang='ko-KR'; u.onstart=()=>log('TTS 시작'); u.onend=()=>log('TTS 끝'); speechSynthesis.speak(u); log('호출'); };
</script></body></html>
